<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Data Bonek Net</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-primary { background: #28a745; border: none; padding: 12px; font-weight: bold; }
        .btn-primary:hover { background: #218838; }
        .status-gps { font-size: 0.8rem; color: #666; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="card p-4 w-100" style="max-width: 500px;">
            <h3 class="text-center mb-4" style="color: #28a745;">Bonek Net Input</h3>
            
            <div class="mb-3">
                <label class="form-label">Nama Lengkap</label>
                <input type="text" id="nama" class="form-control" placeholder="Nama Pelanggan">
            </div>

            <div class="mb-3">
                <label class="form-label">Alamat</label>
                <textarea id="alamat" class="form-control" rows="2"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">No HP / WhatsApp</label>
                <input type="number" id="hp" class="form-control" placeholder="08xxx">
            </div>

            <div class="mb-3">
                <label class="form-label">No KTP (16 Digit)</label>
                <input type="number" id="ktp" class="form-control">
            </div>
<div class="mb-3">
    <label class="form-label">Foto KTP</label>
    <input type="file" id="foto_ktp" class="form-control" accept="image/*">
</div>

<div class="mb-3">
    <label class="form-label">Foto Depan Rumah </label>
    <input type="file" id="foto_rumah" class="form-control" accept="image/*" multiple>
</div>
           

            <div id="gps-info" class="status-gps">📍 Menunggu izin lokasi...</div>

            <button class="btn btn-primary w-100" id="btnKirim" onclick="prosesData()">KIRIM SEKARANG</button>
        </div>
    </div>

    

<script>
async function prosesData() {
    const btn = document.getElementById('btnKirim');
    const fileKtp = document.getElementById('foto_ktp').files[0];
    const filesRumah = document.getElementById('foto_rumah').files;
    
    if(!fileKtp) return alert("Foto KTP wajib diupload!");
    if(filesRumah.length === 0) return alert("Foto rumah minimal 1!");

    btn.disabled = true;
    btn.innerText = "Sedang Mengupload...";

    // Helper konversi ke Base64
    const getBase64 = (file) => new Promise(r => {
        const reader = new FileReader();
        reader.onload = () => r({ base64: reader.result.split(',')[1], mimeType: file.type });
        reader.readAsDataURL(file);
    });

    try {
        // Proses Foto KTP
        const dataKtp = await getBase64(fileKtp);

        // Proses Foto Rumah
        const imagesRumah = [];
        for (let f of filesRumah) {
            imagesRumah.push(await getBase64(f));
        }

        const payload = {
            nama: document.getElementById('nama').value,
            alamat: document.getElementById('alamat').value,
            no_hp: document.getElementById('hp').value,
            no_ktp: document.getElementById('ktp').value,

        };

        const URL_GAS = "URL_APPS_SCRIPT_BARU_ANDA";

        await fetch(URL_GAS, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(payload)
        });

        alert("Data & Foto Berhasil Tersimpan!");
        location.reload();

    } catch (e) {
        alert("Gagal: " + e.message);
        btn.disabled = false;
        btn.innerText = "KIRIM SEKARANG";
    }
}
</script>
