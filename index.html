<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Data Bonek Net</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            padding: 15px; 
            background-color: var(--tg-theme-bg-color, #ffffff); 
            color: var(--tg-theme-text-color, #212529);
            font-family: sans-serif;
        }
        .form-label { font-weight: bold; margin-bottom: 5px; }
        .form-control { 
            margin-bottom: 15px; 
            background-color: var(--tg-theme-secondary-bg-color, #f8f9fa);
            color: var(--tg-theme-text-color, #212529);
            border: 1px solid #ced4da;
        }
        .btn-primary {
            background-color: var(--tg-theme-button-color, #0088cc);
            border: none;
            padding: 12px;
            font-weight: bold;
        }
        #location-status {
            font-size: 0.85rem;
            margin-bottom: 15px;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h4 class="mb-4">Form Input Bonek Net</h4>
        
        <div class="mb-3">
            <label class="form-label">Nama Pelanggan</label>
            <input type="text" id="nama" class="form-control" placeholder="Contoh: Budi Santoso">
        </div>

        <div class="mb-3">
            <label class="form-label">Alamat</label>
            <textarea id="alamat" class="form-control" rows="2" placeholder="Alamat lengkap..."></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">No HP</label>
            <input type="number" id="hp" class="form-control" placeholder="081234567xxx">
        </div>

        <div class="mb-3">
            <label class="form-label">No KTP (16 Digit)</label>
            <input type="number" id="ktp" class="form-control" placeholder="3515xxxxxxxxxxxx">
        </div>

        <div class="mb-3">
            <label class="form-label">Foto Depan Rumah (Max 2)</label>
            <input type="file" id="foto" class="form-control" accept="image/*" multiple>
            <small class="text-muted">Bisa pilih 1 atau 2 foto sekaligus.</small>
        </div>

        <div id="location-status">📍 Mencari lokasi...</div>

        <button class="btn btn-primary w-100" id="btnSubmit" onclick="submitForm()">KIRIM DATA</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Biar layar Mini App langsung penuh
        
        let locationString = "Lokasi tidak diizinkan";

        // Ambil lokasi otomatis saat app dibuka
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                locationString = `${pos.coords.latitude}, ${pos.coords.longitude}`;
                document.getElementById('location-status').innerHTML = `📍 Lokasi terkunci: ${locationString}`;
                document.getElementById('location-status').style.color = "green";
            },
            (err) => {
                document.getElementById('location-status').innerHTML = "⚠️ Gagal mengambil lokasi. Pastikan GPS aktif.";
                document.getElementById('location-status').style.color = "red";
            }
        );

        // Fungsi convert file ke Base64
        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        async function submitForm() {
            const nama = document.getElementById('nama').value;
            const alamat = document.getElementById('alamat').value;
            const hp = document.getElementById('hp').value;
            const ktp = document.getElementById('ktp').value;
            const files = document.getElementById('foto').files;
            const btn = document.getElementById('btnSubmit');

            // Validasi Sederhana
            if (!nama || !alamat || !hp || !ktp) {
                return alert("Harap isi semua kolom!");
            }
            if (ktp.length !== 16) {
                return alert("No KTP harus 16 digit!");
            }
            if (files.length === 0) {
                return alert("Minimal upload 1 foto depan rumah!");
            }

            btn.disabled = true;
            btn.innerText = "SEDANG MENGIRIM...";

            try {
                const imageData = [];
                for (let file of files) {
                    const base64Data = await toBase64(file);
                    imageData.push({
                        base64: base64Data.split(',')[1],
                        mimeType: file.type
                    });
                }

                const payload = {
                    nama: nama,
                    alamat: alamat,
                    no_hp: hp,
                    no_ktp: ktp,
                    lokasi: locationString,
                    images: imageData
                };

                // URL Google Apps Script Mas Ecky
                const GAS_URL = 'https://script.google.com/macros/s/AKfycbyBD4YkuvZCYIRFBlaSbHXz7YAEVZOFypnb6QOmlDyycqUQMeReN6cwgpjgOwU8UX0b4Q/exec';

                await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Penting untuk bypass CORS Google
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // Karena no-cors, kita tidak bisa cek respon JSON
                // Langsung tampilkan sukses
                tg.showAlert("Data Bonek Net berhasil dikirim!", () => {
                    tg.close();
                });

            } catch (error) {
                console.error(error);
                alert("Terjadi kesalahan teknis. Cek koneksi.");
                btn.disabled = false;
                btn.innerText = "KIRIM DATA";
            }
        }
    </script>
</body>
</html>
